pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
}

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
	}
}

rootProject.name = 'DropFiler-Android'

include ':app'

// Miuix XML (HiMiuix) UI library. Its source is vendored in this repository under
// miuix-xml/ (ordinary Git-tracked files) and built locally; no submodule or separate
// repository is needed.
include ':HiMiuix'
project(':HiMiuix').projectDir = file('miuix-xml')
