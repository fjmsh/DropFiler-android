name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - name: Verify target SDK is 36 and no broad storage access
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$BADGING" | grep -E "SdkVersion|uses-permission"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "$BADGING" | grep -q "minSdkVersion:'21'"
          ! echo "$BADGING" | grep -q "MANAGE_EXTERNAL_STORAGE"
          echo "$BADGING" | grep -q "name='android.permission.WRITE_EXTERNAL_STORAGE' maxSdkVersion='28'"
      - name: Verify application ID is fjm.sh.dropfiler
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "^package: name='fjm.sh.dropfiler'"
